; PlatformIO Project Configuration File
;
; Display node: ESP32-C3 + 1.28" round GC9A01 touch display (JCZN
; ESP32-2424S012 board / clones sold under that same PCB on AliExpress).
; The board integrates an ESP32-C3-MINI-1 module, the GC9A01 SPI panel and a
; CST816 capacitive touch controller in one unit - no separate wiring needed.
; Weight/volume still comes from the remote scale board (see
; ../scale-esp32c6) over BLE instead of a local HX711.
;
; Two environments share the settings below ([env] applies to both):
;   esp32-c3-usb  - flash over USB serial (use this the first time, or if OTA
;                   is unreachable/broken)
;   esp32-c3-ota  - flash over Wifi once the USB image is running and
;                   connected (set upload_port to its IP/hostname)
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
lib_deps =
	bitbank2/PNGdec@^1.0.1
	ayushsharma82/ElegantOTA @ ^3.1.7
	esp32async/ESPAsyncWebServer @ ^3.11.2
	tzapu/WiFiManager @ ^2.0.17
	moononournation/GFX Library for Arduino@^1.2.3
	bblanchon/ArduinoJson@^6.19.4
	h2zero/NimBLE-Arduino@^2.5.0
	fbiego/CST816S
build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1

[env:esp32-c3-usb]
upload_protocol = esptool

[env:esp32-c3-ota]
upload_protocol = espota
upload_port = 192.168.1.200
