; PlatformIO Project Configuration File
;
; Display node: ESP32 + GC9A01 round display.
; Weight/volume now comes from the remote scale board (see
; ../scale-esp32c6) over BLE instead of a local HX711.
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:az-delivery-devkit-v4]
platform = espressif32
board = esp32dev
upload_protocol = espota
upload_port = 192.168.1.200
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
lib_deps =
	bitbank2/PNGdec@^1.0.1
	ayushsharma82/ElegantOTA @ ^3.1.7
	esp32async/ESPAsyncWebServer @ ^3.11.2
	tzapu/WiFiManager @ ^2.0.17
	moononournation/GFX Library for Arduino@^1.2.3
	bblanchon/ArduinoJson@^6.19.4
	h2zero/NimBLE-Arduino@^2.5.0
build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
