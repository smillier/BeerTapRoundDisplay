; PlatformIO Project Configuration File
;
; Scale node: ESP32-C6 + HX711 + weight sensors.
; Reads keg weight and broadcasts it over BLE (GATT server) to the
; remote display board (see ../display-esp32).
;
; https://docs.platformio.org/page/projectconf.html

; NOTE: the official "espressif32" platform (PlatformIO registry) dropped
; Arduino framework support for the ESP32-C6 (espidf only). We use the
; community-maintained pioarduino fork instead, which tracks recent
; arduino-esp32 cores and keeps Arduino support for newer chips.
; https://github.com/pioarduino/platform-espressif32

[env:esp32-c6-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
	robtillaart/HX711@^0.3.2
	h2zero/NimBLE-Arduino@^2.5.0
